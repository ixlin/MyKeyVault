name: Deploy MyKeyVault Vault

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and publish the Vault application
        run: dotnet publish src/MyKeyVault.Vault/MyKeyVault.Vault.csproj --configuration Release --output ./publish

      # This is deliberately not a hidden file: SCP globbing does not consistently include dotfiles.
      - name: Write release identity
        run: |
          printf '%s\n' "$GITHUB_SHA" > ./publish/wwwroot/deploy-version.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > ./publish/wwwroot/deploy-time-utc.txt

      - name: Back up the currently deployed release
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            DEST_DIR=/var/www/mykeyvault
            BACKUP_ROOT=/var/backups/mykeyvault/releases
            sudo -n mkdir -p "$BACKUP_ROOT"
            if sudo -n test -d "$DEST_DIR"; then
              stamp=$(date -u +'%Y%m%dT%H%M%SZ')
              sudo -n tar -C "$DEST_DIR" -czf "$BACKUP_ROOT/release-$stamp-${{ github.sha }}.tar.gz" .
              sudo -n sha256sum "$BACKUP_ROOT/release-$stamp-${{ github.sha }}.tar.gz" | sudo -n tee "$BACKUP_ROOT/release-$stamp-${{ github.sha }}.sha256" >/dev/null
            fi
            # Retain the newest ten rollback archives.
            sudo -n find "$BACKUP_ROOT" -type f -name 'release-*.tar.gz' -printf '%T@ %p\n' | sort -nr | tail -n +11 | cut -d' ' -f2- | xargs -r sudo -n rm -f

      - name: Back up Vault database and grant migration privileges
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            CFG_FILE=/var/www/mykeyvault/appsettings.Production.json
            BACKUP_ROOT=/var/backups/mykeyvault/database
            test -f "$CFG_FILE"
            read -r DB_NAME DB_USER < <(sudo -n python3 - "$CFG_FILE" <<'PY'
            import json
            import sys

            with open(sys.argv[1], encoding="utf-8") as config_file:
                config = json.load(config_file)
            connection = config["ConnectionStrings"]["DefaultConnection"]
            fields = {}
            for item in connection.split(";"):
                if "=" in item:
                    key, value = item.split("=", 1)
                    fields[key.strip().lower()] = value.strip()
            database = fields.get("database")
            username = fields.get("username") or fields.get("user id")
            if not database or not username:
                raise SystemExit("Connection string must include Database and Username.")
            print(database, username)
            PY
            )
            case "$DB_NAME:$DB_USER" in (*[!A-Za-z0-9_:]*|:) echo "Unsupported database identifier." >&2; exit 1;; esac
            sudo -n mkdir -p "$BACKUP_ROOT"
            stamp=$(date -u +'%Y%m%dT%H%M%SZ')
            DB_BACKUP="$BACKUP_ROOT/vault-$stamp-${{ github.sha }}.dump"
            sudo -n -u postgres pg_dump --format=custom --no-owner --no-privileges --dbname="$DB_NAME" | sudo -n tee "$DB_BACKUP" >/dev/null
            sudo -n sha256sum "$DB_BACKUP" | sudo -n tee "$DB_BACKUP.sha256" >/dev/null
            sudo -n -u postgres psql --dbname="$DB_NAME" --set=ON_ERROR_STOP=1 <<SQL
            GRANT CONNECT ON DATABASE "$DB_NAME" TO "$DB_USER";
            GRANT USAGE, CREATE ON SCHEMA public TO "$DB_USER";
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO "$DB_USER";
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO "$DB_USER";
            SQL

      - name: Upload release to a unique staging directory
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: publish/*
          target: /tmp/mykeyvault-release-${{ github.sha }}
          strip_components: 1

      - name: Activate release and restart service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            SRC_DIR=/tmp/mykeyvault-release-${{ github.sha }}
            DEST_DIR=/var/www/mykeyvault
            SERVICE=mykeyvault.service
            sudo -n mkdir -p "$DEST_DIR"
            # Production configuration and user uploads must survive application releases.
            sudo -n rsync -a --delete \
              --exclude 'appsettings*.json' \
              --exclude 'wwwroot/uploads' \
              "$SRC_DIR/" "$DEST_DIR/"
            SERVICE_USER=$(systemctl show -p User "$SERVICE" | cut -d= -f2)
            if [ -z "$SERVICE_USER" ]; then SERVICE_USER=www-data; fi
            sudo -n mkdir -p "$DEST_DIR/wwwroot/uploads"
            sudo -n chown -R "$SERVICE_USER":"$SERVICE_USER" "$DEST_DIR"
            sudo -n chmod 750 "$DEST_DIR/wwwroot/uploads"
            # Keep connection strings, encryption material and bootstrap credentials private.
            sudo -n find "$DEST_DIR" -maxdepth 1 -type f -name 'appsettings*.json' -exec chmod 600 {} +
            sudo -n systemctl restart "$SERVICE"
            sudo -n systemctl is-active --quiet "$SERVICE"
            sudo -n test "$(cat "$DEST_DIR/wwwroot/deploy-version.txt")" = "${{ github.sha }}"
            # Keep the last startup diagnostics available in the Action log if health checks fail.
            sudo -n journalctl -u "$SERVICE" -n 40 --no-pager || true
            rm -rf "$SRC_DIR"

      # A deployment is only successful when the public site serves the released revision.
      - name: Verify public Vault pages
        run: |
          set -euo pipefail
          # The first release after a migration can take longer while PostgreSQL applies schema changes.
          curl --fail --show-error --retry 15 --retry-delay 2 --max-time 20 --output /dev/null https://mykeyvault.cn/
          curl --fail --show-error --retry 15 --retry-delay 2 --max-time 20 --output /dev/null https://mykeyvault.cn/Identity/Account/Login
          test "$(curl --fail --silent --show-error --max-time 20 https://mykeyvault.cn/deploy-version.txt)" = "$GITHUB_SHA"
