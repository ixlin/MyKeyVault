# Production model catalog for the sfrost.cn DeepSeek Harness instance.
# Install as /var/lib/deepseek-harness/.dsh/settings.yaml and keep the file
# owned by deepseek-harness:deepseek-harness with mode 0600.

agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: high

llm-deepseek:
  models:
    - id: deepseek-flash
      name: DeepSeek-V4.1-Flash
      inputModalities: [ text, image ]
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
