limit_req_zone $binary_remote_addr zone=sfrost_login:10m rate=5r/m;

map $http_upgrade $sfrost_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sfrost.cn www.sfrost.cn;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://sfrost.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sfrost.cn www.sfrost.cn;

    ssl_certificate /etc/nginx/ssl/sfrost.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sfrost.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sfrost_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;

    location = /__sfrost-auth/check {
        internal;
        proxy_pass http://127.0.0.1:3081/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /__sfrost-auth/login {
        limit_req zone=sfrost_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3081/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /__sfrost-auth/logout {
        proxy_pass http://127.0.0.1:3081/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /__sfrost-auth/account {
        proxy_pass http://127.0.0.1:3081/account;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /__sfrost-auth/account/password {
        limit_req zone=sfrost_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3081/account/password;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 401 = @sfrost_login_redirect;

    location @sfrost_login_redirect {
        return 303 /__sfrost-auth/login;
    }

    location / {
        auth_request /__sfrost-auth/check;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sfrost_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
